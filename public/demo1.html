<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo 1 - 待办</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    h2 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 12px; color: #64748b; font-size: 13px; }
    .row { display: flex; gap: 6px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    button:active { opacity: 0.8; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #fff;
      font-size: 13px;
    }
    .del { color: #ef4444; cursor: pointer; border: none; background: none; }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
    }
    .tall { height: 120px; overflow: auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <h2>待办清单</h2>
  <p>这是 iframe 内部页面，可正常点击、输入、滚动。</p>
  <div class="row">
    <input type="text" id="inp" placeholder="输入待办..." />
    <button id="add">添加</button>
  </div>
  <ul id="list">
    <li>写周报 <button class="del">×</button></li>
    <li>评审代码 <button class="del">×</button></li>
  </ul>
  <div class="tall">
    这里是一段可滚动的内容。<br/>1<br/>2<br/>3<br/>4<br/>5<br/>6<br/>7<br/>8<br/>9<br/>10<br/>结束。
  </div>
  <div class="hint">在父页面：Ctrl+滚轮缩放此 iframe，Ctrl+按住拖动可移动。</div>

  <script>
    var inp = document.getElementById("inp");
    var list = document.getElementById("list");
    document.getElementById("add").addEventListener("click", function () {
      var v = inp.value.trim();
      if (!v) return;
      var li = document.createElement("li");
      li.innerHTML = v + ' <button class="del">×</button>';
      list.appendChild(li);
      inp.value = "";
    });
    list.addEventListener("click", function (e) {
      if (e.target.classList.contains("del")) e.target.parentNode.remove();
    });
  </script>
</body>
</html>
